[margins]
# CME initial (performance bond) margin per contract, in USD.
# Verify current values at your broker's margin page, or at
#   equities https://www.cmegroup.com/markets/equities.html
#   metals   https://www.cmegroup.com/markets/metals.html
#   energy   https://www.cmegroup.com/markets/energy.html
# They change often.
#
# GC_UP / GC_DOWN and CL_UP / CL_DOWN are not set yet, so those two panels
# show a margin error instead of a band. Nothing is guessed on your behalf:
# a plausible-looking wrong margin would quietly distort position sizing,
# which is worse than a visible gap.
#
# Set these with the "Set margins" workflow (Actions tab, works from the
# GitHub mobile app) rather than editing here, so SET_AT is stamped and the
# dashboard can show how old the inputs are.
#
# Up and down legs are separate; a missing leg falls back to the bare
# symbol key (ES / NQ / GC / CL). Until values exist the dashboard shows a clear per-symbol
# margin error rather than a band built on guesses. The 99% / 99.9%
# confidence bands do not depend on these and appear regardless.
#
