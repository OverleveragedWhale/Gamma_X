name: Set margins

# Remote way to update the CME margin values in config.ini - Actions tab ->
# Set margins -> Run workflow, which works from the GitHub mobile app. The
# desktop publisher fast-forwards main on each run, so new values reach it
# without touching that machine.
#
# Up and down legs are separate because margin need not be symmetric. Leaving
# a field blank leaves that value alone. Every write stamps SET_AT, which the
# dashboard displays beside the band.

on:
  workflow_dispatch:
    inputs:
      es_up:
        description: "ES margin per contract, up leg (USD)"
        required: false
        default: ""
      es_down:
        description: "ES margin per contract, down leg (USD)"
        required: false
        default: ""
      nq_up:
        description: "NQ margin per contract, up leg (USD)"
        required: false
        default: ""
      nq_down:
        description: "NQ margin per contract, down leg (USD)"
        required: false
        default: ""
      gc_up:
        description: "GC margin per contract, up leg (USD)"
        required: false
        default: ""
      gc_down:
        description: "GC margin per contract, down leg (USD)"
        required: false
        default: ""
      cl_up:
        description: "CL margin per contract, up leg (USD)"
        required: false
        default: ""
      cl_down:
        description: "CL margin per contract, down leg (USD)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: set-margins
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update config.ini
        env:
          ES_UP: ${{ inputs.es_up }}
          ES_DOWN: ${{ inputs.es_down }}
          NQ_UP: ${{ inputs.nq_up }}
          NQ_DOWN: ${{ inputs.nq_down }}
          GC_UP: ${{ inputs.gc_up }}
          GC_DOWN: ${{ inputs.gc_down }}
          CL_UP: ${{ inputs.cl_up }}
          CL_DOWN: ${{ inputs.cl_down }}
        run: |
          set -euo pipefail
          args=()
          for sym in ES NQ GC CL; do
            for side in UP DOWN; do
              var="${sym}_${side}"
              val="${!var:-}"
              if [ -n "${val}" ]; then
                flag="--$(echo "${sym}-${side}" | tr '[:upper:]' '[:lower:]')"
                args+=("${flag}" "${val}")
              fi
            done
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "::error::Give at least one margin value."
            exit 1
          fi
          python tools/set_margins.py "${args[@]}"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.ini
          if git diff --cached --quiet; then
            echo "values already match; nothing to commit"
            exit 0
          fi
          git commit -m "Set margins via workflow ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
          echo "::notice::config.ini updated. The desktop picks this up on its next run."
