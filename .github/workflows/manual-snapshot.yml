name: Publish snapshot (manual backup)

# Stand-in for the scheduled Windows task when that machine is off. Run it from
# the Actions tab: "Publish snapshot (manual backup)" -> Run workflow.
#
# Deliberately has no schedule. GitHub delivered only ~13% of this repo's
# scheduled firings at arbitrary minutes, so a cron here would be an unreliable
# second writer to the same branch rather than a useful backup.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Shares a group with nothing else today, but keeps two manual runs from
# racing each other onto the same branch.
concurrency:
  group: snapshot-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The same render check the PC runs before it publishes. Without an
      # engine check_page.py warns and passes, so a page that cannot run would
      # go live from here unchecked - the 2026-10-01 blank-page class.
      - name: Install the page-check engine
        run: python -m pip install --quiet --disable-pip-version-check mini-racer

      - name: Generate and publish snapshot
        id: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Work directly on the published branch so --skip-unchanged can
          # compare against the page that is actually live.
          git fetch origin snapshot
          git worktree add pub origin/snapshot

          python gex_terminal.py --snapshot pub/index.html --skip-unchanged
          python tools/check_page.py pub/index.html
          # The setups page never blocks the dashboard: on failure the
          # previous one is restored and the dashboard publishes anyway.
          if ! { python setups.py --pub pub && python tools/check_page.py pub/setups.html; }; then
            echo "setups page failed; previous one kept"
            git -C pub checkout -q -- setups.html setups.json 2>/dev/null || true
          fi
          if ! { python lab.py --pub pub && python tools/check_page.py pub/scorecard.html; }; then
            echo "scorecard page failed; previous one kept"
            git -C pub checkout -q -- scorecard.html 2>/dev/null || true
          fi

          cd pub
          # oi/ as well, as the PC's publisher does: the session's open-interest
          # fingerprint is written once, by its first run, and if that run is
          # this one and the file stays behind, the next day's OI change column
          # has nothing to compare against.
          git add index.html data.json oi setups.html setups.json scorecard.html
          if git diff --cached --quiet; then
            echo "figures match the live page; nothing to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "snapshot $(date -u '+%Y-%m-%d %H:%M UTC') (manual backup)"
          git push origin HEAD:snapshot
          echo "published=true" >> "$GITHUB_OUTPUT"

      # No explicit POST /pages/builds here. It was added on the premise that
      # a push authenticated with GITHUB_TOKEN does not start the
      # pages-build-deployment run. For a branch-source Pages site it does, so
      # the POST only ever asked for a SECOND build of the same commit, and
      # Pages cannot build twice at once: the first was cancelled and recorded
      # as "Page build failed" with duration 0ms. Every manual-backup run left
      # one behind -
      #
      #   22:59:41  Publish snapshot (manual backup)  success
      #   22:59:51  pages build and deployment        cancelled   <- the push
      #   22:59:53  pages build and deployment        success     <- the POST
      #
      # - and the site still came out correct, which is why it went unnoticed.
