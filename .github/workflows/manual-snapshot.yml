name: Publish snapshot (manual backup)

# Stand-in for the scheduled Windows task when that machine is off. Run it from
# the Actions tab: "Publish snapshot (manual backup)" -> Run workflow.
#
# Deliberately has no schedule. GitHub delivered only ~13% of this repo's
# scheduled firings at arbitrary minutes, so a cron here would be an unreliable
# second writer to the same branch rather than a useful backup.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Shares a group with nothing else today, but keeps two manual runs from
# racing each other onto the same branch.
concurrency:
  group: snapshot-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate and publish snapshot
        id: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Work directly on the published branch so --skip-unchanged can
          # compare against the page that is actually live.
          git fetch origin snapshot
          git worktree add pub origin/snapshot

          python gex_terminal.py --snapshot pub/index.html --skip-unchanged

          cd pub
          git add index.html data.json
          if git diff --cached --quiet; then
            echo "figures match the live page; nothing to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "snapshot $(date -u '+%Y-%m-%d %H:%M UTC') (manual backup)"
          git push origin HEAD:snapshot
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Request a Pages build
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A push authenticated with GITHUB_TOKEN does not start the
          # pages-build-deployment run, so the build has to be asked for.
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          cat resp.json
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "::error::Pages build request returned HTTP $code. The commit is"
            echo "::error::pushed but the site may not rebuild. Check that Pages"
            echo "::error::source is 'Deploy from a branch -> snapshot / (root)'."
            exit 1
          fi
          echo "Pages build requested."
