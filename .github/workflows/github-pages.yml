name: Publish GEX snapshot

on:
  schedule:
    # Target cadence: hourly at :16, plus every 5 minutes across the 15:01-16:21
    # ET close window (scheduled at both the EDT and EST placements of it, since
    # cron has no timezone).
    #
    # GitHub delivers only a fraction of these and at arbitrary minutes - the
    # previous "*/30" cron landed ~6 times a day, never once on a :00 or :30
    # slot, with gaps of 2-8 hours. So these crons are a request, not a
    # guarantee, and there is deliberately no time-of-day gate below: a delayed
    # firing is indistinguishable from an on-time one, so gating on the clock
    # would discard real runs and leave the page staler than doing nothing.
    # Every firing that arrives gets published.
    - cron: "16 * * * *"
    - cron: "1,6,11,21,26,31,36,41,46,51,56 19,20,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate dashboard snapshot
        run: python gex_terminal.py --snapshot _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
