name: Feed diagnostics

# Answers three things this repo cannot check from a dev machine behind a proxy:
#   1. how often the Cboe delayed file is actually republished, which decides
#      whether publishing faster than ~15 min is worth anything
#   2. whether the history source is reachable, which scales levels into
#      futures terms and supplies the prior-session high/low/close tags
#   3. whether the futures open-interest feed still works. It rides Yahoo's
#      undocumented v7 quote endpoint, which already grew a crumb requirement
#      once, so it is the likeliest thing here to break quietly - the fallbacks
#      keep printing plausible numbers derived the wrong way.
#
# Read-only. Publishes nothing, writes nothing to the repo.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to watch the Cboe feed"
        default: "20"
      interval:
        description: "Seconds between Cboe polls"
        default: "30"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: History source reachability and futures scaling
        run: |
          python - <<'PY'
          import gex_terminal as g

          # Derived from INSTRUMENTS so this cannot drift when symbols change.
          roles = {"hist": "chain close + prior session",
                   "index": "index close (margin notional, tracking ratio)",
                   "fut": "futures close (chain -> futures scaling)"}
          got = {}
          for inst in g.INSTRUMENTS:
              for role, why in roles.items():
                  sym = inst[role]
                  if sym in got:
                      continue
                  try:
                      got[sym] = g.fetch_closes(sym, max_rows=5)[-1]
                      print(f"  OK    {sym:<8} {got[sym]:>12,.2f}   {inst['future']} {why}")
                  except Exception as exc:
                      print(f"  FAIL  {sym:<8} {type(exc).__name__}: {str(exc)[:70]}")
                      print(f"        -> lost: {inst['future']} {why}")

          print("")
          print("futures scaling gate (-0.01 <= implied carry <= 0.04):")
          for inst in g.INSTRUMENTS:
              fut, hist, idx = inst["fut"], inst["hist"], inst["index"]
              missing = [s for s in (fut, hist, idx) if s not in got]
              if missing:
                  print(f"  {inst['future']}: cannot evaluate, missing {missing}")
                  continue
              k_track = got[idx] / got[hist]
              carry = got[fut] / got[hist] / k_track - 1.0
              ok = -0.01 <= carry <= 0.04
              print(f"  {inst['future']}: k_track={k_track:.4f} carry={carry:+.4f} "
                    f"-> {'ACCEPTED' if ok else 'REJECTED, falls back to index terms'}")
          PY
      - name: Futures open interest feed
        # Non-fatal: a red X here would be indistinguishable from the Cboe probe
        # failing, and this step is the one most likely to trip on an upstream
        # change rather than a bug. The ::warning:: still surfaces in the run
        # summary and in the Actions notification.
        continue-on-error: true
        run: python tools/check_oi_feed.py

      - name: Cboe republish cadence
        env:
          PROBE_MINUTES: ${{ inputs.minutes }}
          PROBE_INTERVAL: ${{ inputs.interval }}
        run: python tools/probe_feed.py SPY "$PROBE_INTERVAL" "$PROBE_MINUTES"
