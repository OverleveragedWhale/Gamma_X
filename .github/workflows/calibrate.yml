name: Refresh trade-plan calibration

# Re-scores every published level against what price did, writes the result to
# calibration.json (which the dashboard's plans read) and appends one row per
# symbol, side and setup to calibration_history.csv.
#
# Weekly, because the figures move: on 2026-10-06 rolling the window by a
# single session moved two verdicts across the line. A refresh that depends on
# someone remembering to run it lets the page drift onto stale base rates, and
# the history file is what shows whether a verdict is settling or still
# swinging, which no single run can.
#
# Saturday, after a week of sessions has closed and before the next opens.
# GitHub fires scheduled runs late and sometimes skips them; for a weekly
# refresh that is harmless, and "Run workflow" on the Actions tab does it by
# hand. The publishing PC pulls main every run, so a refreshed calibration
# reaches the page at its next publish with nothing else to do.

on:
  schedule:
    - cron: "0 14 * * 6"        # Saturday 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calibrate
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # the scorecard reads every snapshot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch the published history
        run: git fetch --no-tags origin +refs/heads/snapshot:refs/remotes/origin/snapshot

      - name: Score the levels
        run: |
          set -euo pipefail
          python tools/score_levels.py --book near --top 2 --select nearest \
              --json calibration.json --log calibration_history.csv \
              --split-log calibration_splits.csv \
              | tee "$RUNNER_TEMP/score.txt"
          {
            echo '### Level scorecard'
            echo '```'
            cat "$RUNNER_TEMP/score.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the refreshed calibration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calibration.json calibration_history.csv calibration_splits.csv
          if git diff --cached --quiet; then
            echo "calibration unchanged"
            exit 0
          fi
          span=$(python -c "import json;d=json.load(open('calibration.json'));print(f\"{d['days']} sessions, {d['from']} to {d['to']}\")")
          git commit -m "Refresh trade-plan calibration ($span)"
          # main may have moved while this ran; rebase onto it rather than
          # failing, since these files are only ever written here.
          git pull --rebase --quiet origin main
          git push origin HEAD:main
