<title>Gamma Terminal</title>
<style>
:root{
  --bg:#0b0f17; --panel:#131b28; --raised:#1a2434; --line:rgba(255,255,255,.08);
  --ink:#e7ecf4;  --muted:#7f8da0;
  --brass:#d9a441; --jade:#4bbf8a; --verm:#e0603f; --stress:#ff5d63;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:1400px;margin:0 auto;padding:20px 18px 60px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px 20px;
  padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
h1{font-family:system-ui,sans-serif;font-weight:800;font-size:19px;
  letter-spacing:.14em;text-transform:uppercase;margin:0}
h1 .g{color:var(--brass)}
.status{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--jade)}
.dot.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.status.closed .dot{background:var(--muted)}
.status.weekend .dot{background:var(--brass)}
.meta{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
  font-size:12px;color:var(--muted);min-width:0}
.meta b{color:var(--ink);font-weight:600}
button{font:inherit;font-size:12px;color:var(--ink);background:var(--raised);
  border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;
  letter-spacing:.08em;text-transform:uppercase}
button:hover{border-color:var(--brass);color:var(--brass)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:18px 20px;margin-bottom:18px}
.phead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.sym{font-family:system-ui,sans-serif;font-weight:800;font-size:22px;letter-spacing:.06em}
.spot{font-size:20px;font-weight:600}
.regime{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 9px;border-radius:5px;border:1px solid transparent}
.regime.positive{color:var(--jade);border-color:rgba(75,191,138,.4);background:rgba(75,191,138,.08)}
.regime.negative{color:var(--verm);border-color:rgba(224,96,63,.4);background:rgba(224,96,63,.08)}
.regime.unknown,.regime.STARTING{color:var(--muted);border-color:var(--line)}
.role{font-size:12px;color:var(--muted);margin-left:auto}
.scale{font-size:10.5px;color:var(--brass);letter-spacing:.05em;
  margin:-6px 0 12px;opacity:.85}
/* The two-column .regimes grid is gone: the three books share one ladder in a
   single full-width block, which is both what makes them comparable row for
   row and what gives the table room - 593px of min-content against 912px even
   at a 1024px viewport, where two half-width tables had 518px and a third
   would never have fitted at all. */
.regime-block{background:var(--raised);border:1px solid var(--line);
  border-radius:10px;padding:14px 16px}
.rhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rlabel{font-family:system-ui,sans-serif;font-weight:700;font-size:11.5px;
  letter-spacing:.05em;color:var(--ink)}
/* Net GEX and Flip sat in a 150px sidebar beside the ladder, which cost the
   table 168px it could not spare and left the sidebar mostly empty. */
.rbody{min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:4px 30px;margin-bottom:4px}
.stat{margin-bottom:0}
.stat .k{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:17px;font-weight:600}
/* vanna and charm sit beside net gamma but are secondary to it */
.stat .v.sm{font-size:14px;font-weight:500}
.v.pos{color:var(--jade)}.v.neg{color:var(--verm)}
.flash{animation:flash 1s ease-out}
@keyframes flash{from{background:rgba(217,164,65,.25)}to{background:transparent}}
/* walls */
/* overflow-x is the backstop: tag text is data-driven, so a long enough
   chip run scrolls inside the block rather than over it. */
.walls{margin-top:14px;min-width:0;overflow-x:auto}
/* per-book summary above the ladder */
.books{min-width:0;overflow-x:auto}
.books table{width:auto;min-width:420px}
.books td,.books th{padding:3px 12px 3px 0}
.books .bk{text-transform:uppercase;letter-spacing:.1em;font-size:10px;
  color:var(--muted)}
.books tbody tr:last-child td{border-bottom:none}
/* summary and profile share the row; the profile takes what is left */
.topline{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.vp{display:flex;flex-wrap:wrap;gap:18px;flex:0 1 auto;min-width:0;max-width:100%}
.vpcol{min-width:150px}
.vp .k{font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px;white-space:nowrap}
.vp .k .sub{letter-spacing:.04em;text-transform:none;opacity:.7}
.vpwrap{border-left:1px solid var(--line);padding-left:3px}
/* the shared price axis both profiles are drawn over */
.vpaxis{display:flex;flex-direction:column;justify-content:space-between;
  font-size:10px;color:var(--muted);padding:18px 0 22px;text-align:right}
.vprow{height:3px;margin-bottom:1px}
.vpbar{display:block;height:100%;background:var(--line)}
.vprow.inva .vpbar{background:rgba(217,164,65,.55)}
.vprow.poc .vpbar{background:var(--brass)}
.vprow.edge .vpbar{background:rgba(217,164,65,.8)}
.vplegend{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;font-size:11px;
  color:var(--muted)}
.vplegend b{color:var(--brass)}
.chip.vp{color:var(--brass);border-color:rgba(217,164,65,.45)}
.chip.src{color:var(--muted);border-color:var(--line);letter-spacing:.04em}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:4px 8px;border-bottom:1px solid var(--line)}
td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.04)}
td.num{text-align:right}
.side-c{color:var(--jade)}.side-p{color:var(--verm)}
.split{font-size:11px;white-space:nowrap}
.split .sep{color:var(--muted);opacity:.6}
.chip.cut{color:var(--brass);border-color:rgba(217,164,65,.4)}
.chip.flip{color:var(--stress);border-color:rgba(255,93,99,.45)}
/* a level that is call-dominated in one book and put-dominated in another */
tr.flipped td{background:rgba(255,93,99,.07)}
tr.flipped td:first-child{box-shadow:inset 2px 0 0 var(--stress)}
/* a wall on the "wrong" side of spot - puts above, calls below */
.chip.inv{color:var(--brass);border-color:rgba(217,164,65,.5)}
tr.inverted td{background:rgba(217,164,65,.06)}
tr.inverted td:first-child{box-shadow:inset 2px 0 0 var(--brass)}
tr.inverted.flipped td:first-child{
  box-shadow:inset 2px 0 0 var(--brass),inset 4px 0 0 var(--stress)}
tr.spotrow td{color:var(--ink);font-weight:700;letter-spacing:.06em;
  background:rgba(255,255,255,.05);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.chip{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.chip.conf{color:var(--ink);border-color:rgba(255,255,255,.25)}

.chip.decay{color:var(--muted)}
.chip.decay.hot{color:var(--brass);border-color:rgba(217,164,65,.45)}
.max-pain{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.zero .caveat{margin-top:8px;font-size:10.5px;line-height:1.5;
  color:var(--muted);max-width:72ch}
.zero .caveat b,.zero .k b{color:var(--brass);font-weight:500}

.zero{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);min-width:0}
/* the table scrolls inside its own block, like the ladder and book tables */
.zero .ztab{min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.zero .k{font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px}
.zero .zsum{font-size:11.5px;color:var(--muted);margin-bottom:6px;line-height:1.5}
.zero .zsum b{color:var(--ink);font-weight:500}
.zero table{width:auto;min-width:480px}
.zero td,.zero th{padding:3px 12px 3px 0}
.zero .tvsub{margin:10px 0 3px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tvrank{display:inline-block;min-width:22px;text-align:center;border:1px solid var(--line);border-radius:3px;font-size:10.5px}
.zero tr.tv1 .tvrank{border-color:var(--brass);color:var(--brass);background:rgba(217,164,65,.12)}
.zero tr.tv1 td{color:var(--ink)}
.chip.tvchip{color:var(--brass);border-color:rgba(217,164,65,.45)}

.con-on{color:var(--jade)}
.con-off{opacity:.5}
.con-warn{color:var(--brass);opacity:.85}
.max-pain .sub{letter-spacing:.04em;text-transform:none;opacity:.6;font-weight:400}
.max-pain tr.opex td{color:var(--ink)}
.max-pain .tag{font-size:9px;letter-spacing:.1em;padding:1px 5px;margin-left:6px;
  border:1px solid var(--line);border-radius:3px;color:var(--muted);vertical-align:middle}
.max-pain .k{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  margin-bottom:5px}
.eff{margin-top:12px;font-size:12.5px}
.eff b{color:var(--brass);letter-spacing:.08em}
.thin{color:var(--stress)}
.pre{color:var(--muted);opacity:.85}
#pinebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 2px}

#pinebar .pnote{font-size:10px;letter-spacing:.04em;color:var(--muted);opacity:.8}
#pinebar .pnote.warn{color:var(--brass);opacity:1}
#pinebar code.pine{flex:1 1 320px;overflow-x:auto;white-space:nowrap}
code.pine{background:var(--raised);border:1px solid var(--line);border-radius:4px;
  padding:1px 6px;color:var(--brass);cursor:pointer;user-select:all}
.mrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:13px;
  padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.err{color:var(--stress);font-size:12.5px}
.foot{margin-top:26px;font-size:11px;color:var(--muted);line-height:1.7}
.foot .assume{color:var(--brass);opacity:.9}
.foot .vix{color:var(--ink);opacity:.8}
.flowrow{display:flex;gap:18px;flex-wrap:wrap;margin-top:11px;padding-top:9px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.flowrow b{color:var(--ink)}
.chip.oi.up{color:var(--jade);border-color:rgba(75,191,138,.4)}
.chip.oi.down{color:var(--verm);border-color:rgba(224,96,63,.4)}
.navlink{color:var(--brass);text-decoration:none;border:1px solid var(--brass);
  border-radius:4px;padding:5px 10px;font-size:12px;letter-spacing:.06em}
.navlink:hover{background:rgba(217,164,65,.1)}
/* Setups / Scorecard stacked, so the header fits a phone without zooming */
.navstack{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.navstack .navlink{text-align:center;white-space:nowrap}
@media(prefers-reduced-motion:reduce){.dot.pulse{animation:none}.flash{animation:none}}

// Contract size, shared by the dashboard, setups and scorecard (same origin):
// micros trade at the same prices, so every level is unchanged and only the
// dollars scale - MES $5, MNQ $2, MGC $10 a point, a tenth of ES/NQ/GC.
const GX_MICRO = {ES:{sym:"MES",f:0.1}, NQ:{sym:"MNQ",f:0.1}, GC:{sym:"MGC",f:0.1}};
function gxSize(){ try{ return localStorage.getItem("gx_size")==="micro" ? "micro" : "mini"; }catch(e){ return "mini"; } }
function gxF(sym){ return gxSize()==="micro" && GX_MICRO[sym] ? GX_MICRO[sym].f : 1; }
function gxName(sym){ return gxSize()==="micro" && GX_MICRO[sym] ? GX_MICRO[sym].sym : sym; }
function gxToggleHtml(){
  const m = gxSize()==="micro";
  return `<span class="gxsize" style="display:inline-flex;border:1px solid rgba(255,255,255,.15);border-radius:4px;overflow:hidden;font-size:11.5px">`
    + `<button onclick="gxSet('mini')" style="background:${m?"none":"rgba(217,164,65,.18)"};color:inherit;border:0;padding:5px 9px;cursor:pointer;font:inherit">Mini</button>`
    + `<button onclick="gxSet('micro')" style="background:${m?"rgba(217,164,65,.18)":"none"};color:inherit;border:0;padding:5px 9px;cursor:pointer;font:inherit">Micro</button></span>`;
}
function gxSet(v){ try{ localStorage.setItem("gx_size", v); }catch(e){} if(typeof gxRepaint==="function") gxRepaint(); }
// Every *_usd number in a payload, scaled for the size; the symbol comes from
// the nearest "symbol" field or an ES/NQ/GC key above it.
function gxScale(o, sym){
  if(Array.isArray(o)) return o.map(x=>gxScale(x, sym));
  if(!o || typeof o!=="object") return o;
  const s = o.symbol || sym, out = {};
  for(const [k,v] of Object.entries(o)){
    if(typeof v==="number" && /(^|_)usd$|^usd$/.test(k)) out[k] = Math.round(v*gxF(s));
    else out[k] = gxScale(v, GX_MICRO[k] ? k : s);
  }
  return out;
}

function chainName(s){ return String((s&&s.chain)||"").replace(/^_/,""); }

// One summary row per book: the figures that describe the whole book rather
// than any single strike. Stacked so the three are read against each other -
// a flip that moves between books is the point.
// A horizontal histogram, widest row at the POC. Rows inside the value area
// are solid, the rest faded, so the 70% band reads without a second legend.
// One profile. Drawn from the GROUPED rows - the levels in the legend come
// from the full-resolution bins, which run past 150 rows on a weekly NQ.
function oneProfile(vp){
  if(!vp||!vp.bins||!vp.bins.length) return "";
  // Nearest drawn row to each mark, since grouping means no row sits exactly
  // on the fine-bin price.
  const near=(px)=>{
    let bi=0,bd=Infinity;
    vp.bins.forEach((b,i)=>{const d=Math.abs(b.p-px); if(d<bd){bd=d;bi=i;}});
    return bi;
  };
  const iPoc=near(vp.poc), iVah=near(vp.vah), iVal=near(vp.val);
  const rows=vp.bins.map((b,i)=>{
    const hit = i===iPoc ? " poc" : (i===iVah||i===iVal ? " edge" : "");
    const bar = b.v>0
      ? `<span class="vpbar" style="width:${Math.max(1,b.v*100).toFixed(1)}%"></span>`
      : "";
    return `<div class="vprow${b.in?" inva":""}${hit}" title="${b.p}">${bar}</div>`;
  }).reverse().join("");
  const title = vp.label==="prev" ? "Prev session" : `${vp.sessions}-session`;
  return `<div class="vpcol">`
    +`<div class="k">${title} <span class="sub">${vp.bin}pt</span></div>`
    +`<div class="vpwrap">${rows}</div>`
    +`<div class="vplegend">`
      +`<span><b>POC</b> ${vp.poc}</span>`
      +`<span>VAH ${vp.vah}</span><span>VAL ${vp.val}</span>`
      +`<span class="pre">traded ${vp.lo}&ndash;${vp.hi}</span>`
    +`</div></div>`;
}

function volumeProfile(vps){
  const list=(vps||[]).filter(Boolean);
  if(!list.length) return "";
  // Every profile is drawn over the SAME price axis, so a row at the same
  // height is the same price in both and they can be read across. A gap in
  // one column is price that lookback never traded.
  const ax=list[0];
  const scale = (ax.axis_hi!==undefined)
    ? `<div class="vpaxis"><span>${ax.axis_hi}</span><span>${ax.axis_lo}</span></div>`
    : "";
  return `<div class="vp">`+scale+list.map(oneProfile).join("")+`</div>`;
}

// Today's expiry on its own: the standing book, the day's flow, and what
// traded since the last snapshot. Measured, it is ~90% of the session's flow
// and a fraction of the open interest the walls are built from, so it gets
// its own read instead of being averaged into the books.
function topVolSection(s){
  const t=s.topvol;
  if(!t) return "";
  const eq = `${chainName(s)}-equivalent contracts`;
  const dp = s.symbol==="GC"?1:0;
  const fs = r => `${(+r.strike).toFixed(dp)}`;
  const fd = r => `${r.dist>0?"+":""}${r.dist}%`;
  const gc = (v,str) => str!=null ? `<td class="num ${(v||0)>=0?"pos":"neg"}">${str}</td>` : `<td class="num">\u2014</td>`;
  const rk = i => `<td><span class="tvrank">#${i}</span></td>`;
  const sub = (b,title,what) => `<div class="tvsub">${title} \u00b7 ${what} \u00b7 ${b.exp} (${b.dte}d) \u00b7 ${(b.total||0).toLocaleString()} traded</div>`;
  const none = title => `<div class="tvsub">${title} \u00b7 no expiry listed</div>`;
  const EXPS=[["0dte","0DTE"],["weekly","Weekly"],["monthly","Monthly"]];
  // 1) highest combined volume, with each side's volume and the net GEX there
  const combHead = `<thead><tr><th>Rank</th><th class="num">Strike</th><th class="num">Dist</th>`
    + `<th class="num">Call vol</th><th class="num">Put vol</th><th class="num">Total \u00b7 share</th>`
    + `<th class="num" title="Net GEX of this expiry's open interest at the strike">GEX expiry</th>`
    + `<th class="num" title="Net GEX of every expiry's open interest at the strike">GEX all</th></tr></thead>`;
  const comb = EXPS.map(([key,title])=>{
    const b=t[key]||{};
    if(b.none||!(b.rows||[]).length) return none(title);
    return sub(b,title,"calls + puts") + `<div class="ztab"><table>${combHead}<tbody>`
      + b.rows.map(r=>`<tr class="tv${r.rank}">${rk(r.rank)}<td class="num">${fs(r)}</td><td class="num">${fd(r)}</td>`
        +`<td class="num pos">${r.call.toLocaleString()}</td><td class="num neg">${r.put.toLocaleString()}</td>`
        +`<td class="num"><b>${r.vol.toLocaleString()}</b>${r.share!=null?` <span class="pre">${r.share}%</span>`:""}</td>`
        +gc(r.gex,r.gex_str)+gc(r.gex_all,r.gex_all_str)+`</tr>`).join("")
      + `</tbody></table></div>`;
  }).join("");
  // 2) the single call and put contracts that traded most
  const sideHead = `<thead><tr><th>Rank</th><th class="num">Top call</th><th class="num">Call vol</th>`
    + `<th class="num">Top put</th><th class="num">Put vol</th></tr></thead>`;
  const sides = EXPS.map(([key,title])=>{
    const b=t[key]||{};
    if(b.none||!((b.calls||[]).length||(b.puts||[]).length)) return none(title);
    const n=Math.max((b.calls||[]).length,(b.puts||[]).length);
    let body="";
    for(let i=0;i<n;i++){
      const c=(b.calls||[])[i], p=(b.puts||[])[i];
      body+=`<tr class="tv${i+1}">${rk(i+1)}`
        +`<td class="num pos">${c?`${fs(c)} <span class="pre">${fd(c)}</span>`:"\u2014"}</td><td class="num pos">${c?c.vol.toLocaleString():"\u2014"}</td>`
        +`<td class="num neg">${p?`${fs(p)} <span class="pre">${fd(p)}</span>`:"\u2014"}</td><td class="num neg">${p?p.vol.toLocaleString():"\u2014"}</td></tr>`;
    }
    return sub(b,title,"calls and puts apart") + `<div class="ztab"><table>${sideHead}<tbody>${body}</tbody></table></div>`;
  }).join("");
  const asof = s.topvol_at?` <span class="pre" style="letter-spacing:0;text-transform:none">\u00b7 as of ${String(s.topvol_at).slice(5)} ET, refreshed daily after 18:00</span>`:"";
  return `<div class="zero"><div class="k">Highest combined volume<b>*</b>${asof}</div>${comb}</div>`
    + `<div class="zero"><div class="k">Highest call and put volume<b>*</b>${asof}</div>${sides}`
    + `<div class="caveat"><b>*</b> Contracts traded (${eq}) for each expiry, among strikes within `
    + `\u00b1${TOP_VOL_RANGE_PCT}% of price. Combined ranks strikes by calls + puts (share is of the expiry's whole `
    + `volume) and shows each side's volume there, with the net GEX of open interest at the strike: that expiry's `
    + `contracts, and all expiries in the book (calls +, puts \u2212). The second table ranks the single call and put `
    + `contracts that traded most. "0DTE" is the next expiry, Monday's on a weekend. Volume is Cboe's cumulative count `
    + `for the session; it shows where size traded, not who bought or sold. Walls on the ladder that are also one of `
    + `these strikes carry a <span class="chip tvchip">vol</span> tag.</div></div>`;
}

// The combined ladder: one row per strike, one column per book, so "is this
// wall this week's or the monthly book's" is read across rather than by
// flipping between two tables that ordered their strikes differently.
function ladderRow(w,books){
  let chips="";
  if(w.conf) chips+=`<span class="chip conf">~${w.conf}</span>`;
  // Sitting on the volume profile: a wall at the POC has traded size behind
  // it as well as gamma, a wall in a volume hole has only the gamma.
  if(w.vp) chips+=` <span class="chip vp">${w.vp}</span>`;
  if(w.both) chips+=` <span class="chip src">${w.src}</span>`;
  // One of the three highest-volume strikes of the 0DTE, weekly or monthly expiry.
  for(const tv of (w.topvol||[])) chips+=` <span class="chip tvchip">${tv}</span>`;
  // Call-dominated in one book, put-dominated in another. The cell colours
  // already say it, but only if you are looking at that row - the chip and
  // the row tint make it findable while scanning.
  if(w.sign_flip) chips+=` <span class="chip flip">sign flip</span>`;
  // A put wall above spot caps nothing on the way up - it is a level price
  // has already traded through, or one dealers are short into. Either way the
  // usual "calls above cap, puts below support" reading does not apply.
  if(w.inverted) chips+=` <span class="chip inv">${w.side==="put"?"put above":"call below"}</span>`;
  if(w.short_frac!==null&&w.short_frac!==undefined&&w.short_frac>=0.5)
    chips+=` <span class="chip decay hot">${Math.round(w.short_frac*100)}% exp</span>`;
  // Open interest change since the previous stored session, on the strike
  // itself: a wall being BUILT reads differently from one decaying out.
  if(w.d_oi_pct!==null&&w.d_oi_pct!==undefined&&Math.abs(w.d_oi_pct)>=10)
    chips+=` <span class="chip oi ${w.d_oi_pct>0?"up":"down"}">`
      +`${w.d_oi_pct>0?"+":""}${Math.round(w.d_oi_pct)}% OI</span>`;
  const cells = books.map(b=>{
    const c=(w.books||{})[b];
    if(!c||c.net===null||c.net===undefined) return `<td class="num pre">—</td>`;
    // The split for THIS book, on hover - the net alone hides how contested
    // the strike is, and each book has its own answer.
    const tip = (c.call_str&&c.put_str) ? ` title="${b}: calls ${c.call_str} / puts ${c.put_str}"` : "";
    return `<td class="num ${c.net>=0?"pos":"neg"}"${tip}>${c.str}</td>`;
  }).join("");
  return `<tr class="${w.sign_flip?"flipped":""}${w.inverted?" inverted":""}">`
    +`<td class="side-${w.side[0]}">${w.side.toUpperCase()}</td>`
    +`<td class="num">${(+w.strike).toFixed(0)}</td>`
    +cells
    +`<td class="num ${(w.flow||0)>=0?"pos":"neg"}">${w.flow_str||"\u2014"}</td>`
    +`<td class="num ${(w.z||0)>=0?"pos":"neg"}">${w.z_str||"\u2014"}</td>`
    +(function(){
       const c=(w.books||{})[books[0]]||{};
       const cs=c.call_str||w.call_str, ps=c.put_str||w.put_str;
       return `<td class="num split"><span class="side-c">${cs}</span>`
         +` <span class="sep">/</span> <span class="side-p">${ps}</span></td>`;
     })()
    +`<td class="num">${w.dist>0?"+":""}${w.dist}%</td>`
    +`<td class="num pre">${w.chain_k!==undefined&&w.chain_k!==null?(+w.chain_k).toFixed(2):"—"}</td>`
    +`<td>${chips}</td></tr>`;
}

function combinedLadder(s,rows,books,spot,spotPre){
  if(!rows||!rows.length) return "";
  const span = books.length;
  const above=rows.filter(w=>+w.strike>+spot), below=rows.filter(w=>+w.strike<=+spot);
  const spotRowHtml = (spot==null) ? "" :
    `<tr class="spotrow"><td>SPOT</td><td class="num">${(+spot).toFixed(2)}</td>`
    +`${"<td class=\"num\">—</td>".repeat(span)}`
    +`<td class="num">\u2014</td>`   // Flow, blank on the spot row
    +`<td class="num">\u2014</td>`   // 0DTE, likewise
    +`<td class="num">—</td><td class="num">0.00%</td>`
    +`<td class="num pre">${spotPre!==undefined&&spotPre!==null?(+spotPre).toFixed(2):"—"}</td>`
    +`<td></td></tr>`;
  const head = `<tr><th>Side</th><th class="num">Strike</th>`
    + books.map(b=>`<th class="num">${b}</th>`).join("")
    + `<th class="num" title="Gamma-weighted volume traded TODAY at this strike, netted. Open interest is T-1; this is the session. Not an exposure - volume says a contract traded, not whether it opened or closed.">Flow</th>`
    + `<th class="num" title="Gamma from TODAY's expiry alone, from open interest - where same-day pinning pressure sits beside the longer-dated books. Open interest is yesterday's close, so positions opened today are not in it.">0DTE</th>`
    + `<th class="num" title="Calls and puts behind the ${books[0]} net. Hover any book's cell for its own split.">Call / Put &middot; ${books[0]}</th><th class="num">Dist</th>`
    + `<th class="num">${chainName(s)}</th><th>Tags</th></tr>`;
  return `<div class="walls"><table><thead>${head}</thead><tbody>`
    + above.map(w=>ladderRow(w,books)).join("")
    + spotRowHtml
    + below.map(w=>ladderRow(w,books)).join("")
    + `</tbody></table></div>`;
}

function panel(s){
  if(!s.ok) return `<div class="panel"><div class="phead"><span class="sym">${s.symbol}</span></div><div class="err">error: ${s.error}</div></div>`;
  const m=s.margin||{};
  let marg="";
  const rk=s.risk||{};
  if(rk.bands){
    marg+=`<div class="mrow"><span>realized σ <b style="color:var(--ink)">${rk.sigma_pct}%</b>/day`
        +` over ${rk.bars} bars, about the ${rk.anchor_date} close ${rk.anchor} → `
        +rk.bands.map(b=>`${b.label} ±${b.points} (${b.lo}–${b.hi})`).join(" · ")
        +`</span></div>`;
  } else if(rk.error){ marg+=`<div class="mrow">risk bands: ${rk.error}</div>`; }
  if(m.error){ marg+=`<div class="mrow">margin: ${m.error}</div>`; }
  else if(m.points_up!==undefined){
    marg+=`<div class="mrow"><span>${m.future} margin `
        +`<b style="color:var(--ink)">+${m.points_up}/−${m.points_down} pts</b>`
        +` → band ${m.band_lo}–${m.band_hi}`
        +` · set ${m.set_at}</span></div>`;
    {
      // Per contract, for the size picked in the header: same prices, the
      // dollars scale with the point value.
      const mic = gxSize()==="micro" && m.micro ? m.micro : null;
      const pv = mic ? mic.multiplier : m.multiplier;
      const mu = mic ? mic.margin_up : m.margin_up, md = mic ? mic.margin_down : m.margin_down;
      const vb = (m.vol_bands||[]);
      if(pv) marg+=`<div class="mrow"><span>per <b style="color:var(--ink)">${mic?mic.symbol:m.future}</b> contract: `
        +`<b style="color:var(--ink)">$${pv}</b>/pt · margin $${(mu||0).toLocaleString()} up / $${(md||0).toLocaleString()} down`
        +(mic&&mic.estimated?` <span style="opacity:.7">(est. ⅒ of ${m.future}; set ${mic.symbol}_UP/_DOWN in config.ini)</span>`:"")
        +(vb.length?` · ${vb.map(b=>`${b.label} band ≈ $${Math.round(b.points*pv).toLocaleString()}`).join(" · ")}`:"")
        +`</span></div>`;
    }
    if((m.vol_bands||[]).length){
      const vm=m.vol_model||{};
      marg+=`<div class="mrow"><span>liquidation bands (daily close inside ~95% / ~99% of sessions), off the `
          +`${m.liq_anchor_date?m.liq_anchor_date+" ":""}${m.liq_anchor} close: `
          +m.vol_bands.map(b=>`<b style="color:var(--jade)">${b.label} −${b.down}/+${b.up}</b>`
                       +` (${b.lo}–${b.hi})`).join(" · ")
          +`</span></div>`
          +`<div class="mrow"><span style="opacity:.8">EWMA σ <b style="color:var(--ink)">${vm.sigma_pct}%/day</b>`
          +(vm.method==="fhs"?` × fat-tail quantiles ${m.vol_bands.map(b=>b.q).join(" / ")} from ${vm.n} sessions of ${vm.source} through ${vm.through}`
                             :` × normal quantiles (${vm.note||"no long history"})`)
          +`</span></div>`;
    }
    if(m.old&&m.old.ri){
      const a=m.pine_anchor!=null?m.pine_anchor:m.liq_anchor;
      marg+=`<div class="mrow"><span>original bands (12.5% of margin${m.old.factor&&m.old.factor!==1?` × ${m.old.factor} for micro/nano`:""} · Rocket Scooter RI method): `
          +`<b style="color:var(--brass)">RI ±${m.old.ri}</b> (${(a-m.old.ri).toFixed(2)}–${(a+m.old.ri).toFixed(2)}) · `
          +`99.9% ±${m.old.x999} · up/down legs ${m.old.ri_up} / ${m.old.ri_down}</span></div>`;
    }
    if((m.liq||[]).length&&m.liq[0].points!==undefined){
      marg+=`<div class="mrow"><span style="opacity:.75">margin-implied, for reference: `
          +m.liq.map(b=>`${b.label} ±${b.points}`).join(" · ")
          +`</span></div>`
          +`<div class="mrow"><span style="opacity:.8">margin-implied σ <b style="color:var(--ink)">${m.sigma_points} pts`
          +`${m.sigma_pct!=null?` (${m.sigma_pct}%/day)`:""}</b> = margin pts ÷ (${m.z_cover} × √${m.mpor_days}d), `
          +`SPAN's ${Math.round((m.coverage||0)*1000)/10}% one-sided coverage; bands = 1.96σ / 2.58σ`
          +`${rk.sigma_pct!=null?` · realized σ ${rk.sigma_pct}%/day`:""}</span></div>`;

    }
  }
  const regimes=s.regimes||{};
  const maxPain=(s.max_pain||[]).length
    ? `<div class="max-pain"><div class="k">Max pain by expiry `
      +`<span class="sub">next ${MAX_PAIN_DAILY_DAYS}d + monthly opex</span></div>`
      +`<table><thead><tr><th>Expiry</th><th class="num">Level</th><th class="num">Dist</th><th class="num">${chainName(s)}</th><th class="num">Open-interest loss</th></tr></thead><tbody>`
      +(s.max_pain||[]).map(p=>`<tr${p.monthly?' class="opex"':''}><td>${p.expiry}${p.monthly?' <span class="tag">OPEX</span>':''}</td><td class="num">${(+p.strike).toFixed(2)}</td><td class="num">${p.dist>0?"+":""}${p.dist}%</td><td class="num pre">${p.strike_pre!==undefined&&p.strike_pre!==null?(+p.strike_pre).toFixed(2):"\u2014"}</td><td class="num">${p.loss_str}</td></tr>`).join("")
      +`</tbody></table></div>`
    : "";
  // One block per symbol now, not one per book: three books in three columns
  // of a single ladder. Two half-width tables could not be compared row for
  // row, and a third would not have fitted - 3 blocks leave 395px against a
  // table needing 489.
  const fl = s.flow||{};
  // rk is already declared at the top of panel() for the margin block - a
  // second `const rk` here is a lexical REDEFINITION, which is an early
  // error: the whole script fails to compile and the page renders nothing
  // at all. Balanced-delimiter checks and esprima both pass it, because it
  // is a semantic error rather than a syntactic one.
  // Today against the standing book. Turnover near 1 means the page is
  // describing a book most of which has already changed hands.
  const flowNote = (fl.pc_vol!==null&&fl.pc_vol!==undefined)
    ? `<div class="flowrow">`
      +`<span>put/call <b>${fl.pc_vol}</b> today <span class="pre">vs ${fl.pc_oi} open</span></span>`
      +`<span>turnover <b>${(fl.turnover!==null&&fl.turnover!==undefined)?(fl.turnover*100).toFixed(0)+"%":"\u2014"}</b> of open interest</span>`
      +(rk.implied_pct
         ? `<span>implied <b>${rk.implied_pct}%</b>/day <span class="pre">vs ${rk.sigma_pct}% realized`
           +`${(rk.iv_rv_pct!==null&&rk.iv_rv_pct!==undefined)?` (${rk.iv_rv_pct>0?"+":""}${rk.iv_rv_pct})`:""}</span></span>`
         : "")
      +(s.oi_prev_date?`<span class="pre">OI change vs ${s.oi_prev_date}</span>`:"")
      +`</div>`
      +(s.greeks
         ? `<div class="flowrow" title="Open-interest-weighted greeks of the book as held by its owners; dealers carry roughly the opposite.">`
           +`<span>book delta <b>${s.greeks.delta_str}</b></span>`
           +`<span>vega <b>${s.greeks.vega_str}</b><span class="pre">/vol pt</span></span>`
           +`<span>theta <b>${s.greeks.theta_str}</b><span class="pre">/day</span></span>`
           +((s.chain_src||[]).length?`<span class="pre">chains: ${(s.chain_src||[]).join(" + ")}</span>`:"")
           +`</div>`
         : "")
    : "";
  const books = s.books||["near","full"];
  const held = s.regimes_from
    ? `<div class="err">${s.held_reason||"Cboe greeks missing this run"} - ${s.held_all?"this panel is":"GEX and walls are"} held from ${s.regimes_from}.</div>`
    : "";
  const body = (s.ladder&&s.ladder.length)
    ? held+`<div class="regime-block">`
      + `<div class="topline">` + bookSummary(s,regimes,books)
        + volumeProfile(s.vp) + `</div>`
      + combinedLadder(s,s.ladder,books,s.spot,s.spot_pre)
      + ((regimes[books[0]]&&regimes[books[0]].dispersed&&regimes[books[0]].dispersed.length)
          ? `<div class="eff thin">Dispersed gamma (${regimes[books[0]].dispersed.join("/")}) &mdash; no single dominant wall. Lean on volume profile / prior levels or stand down.</div>`
          : "")
      + flowNote
      + `</div>`
    : `<div class="err">${s.error_note||"no usable option contracts returned"}</div>`;
  return `<div class="panel">
    <div class="phead">
      <span class="sym">${s.symbol}</span>
      <span class="spot" data-k="${s.symbol}-spot">${s.spot.toFixed(2)}</span>
      ${contractTag(s.contract)}
    </div>
    ${contractRow(s.contract)}
    ${s.scale_note?`<div class="scale">levels: ${s.scale_note}</div>`:""}
    ${body}
    ${topVolSection(s)}
    ${maxPain}
    ${marg}
  </div>`;
}

function contractTag(c){
  if(!c||!c.label) return "";
  return `<span class="active-con" title="front contract by ${c.source}">${c.label}</span>`;
}

// The runners-up are shown too: on a normal day one contract carries nearly all
// the volume, and seeing the gap is what tells you the pick is unambiguous.
function contractRow(c){
  if(!c||!(c.candidates||[]).length) return "";
  const rolled = c.date_rule && c.date_rule!==c.expiry;
  // Rank on whichever measure actually drove the pick, so the highlighted
  // contract is always the largest number shown.
  const key = c.source==="volume" ? "volume" : "oi";
  const list = c.candidates.map(r=>{
    const n = r[key]==null ? "n/a" : (+r[key]).toLocaleString();
    return r.active
      ? `<b class="con-on">${r.label} ${n}</b>`
      : `<span class="con-off">${r.label} ${n}</span>`;
  }).join(" · ");
  const by = c.degraded
    ? `<b class="con-warn"> · by ${c.source} — OI feed down</b>`
    : `<span style="opacity:.7"> · by ${c.source}</span>`;
  return `<div class="scale">contract: ${list}${by}`
       + (rolled?` <span class="con-warn">date rule would use ${c.date_rule}</span>`:"")
       + `</div>`;
}

async function fetchData(){
  if(!IS_SNAPSHOT) return await fetch("/api/data",{cache:"no-store"}).then(res=>res.json());
  // Unique query param gets past the Pages CDN. Falling back to the baked-in
  // copy keeps the page working on first paint and when opened off disk.
  //
  // The same file is also read straight off the snapshot branch. Pages only
  // updates when an Actions runner builds it: on 2026-10-05 an Actions outage
  // left every build from 15:20 queued and cancelled by the next push, and
  // the site sat on 15:15 while the branch had every snapshot to 16:05. The
  // raw file server does not depend on Actions (CORS-open, ~5 min cache), so
  // the newer of the two wins.
  const get = async url => {
    try{
      const res = await fetch(url,{cache:"no-store"});
      if(res.ok) return await res.json();
    }catch(e){}
    return null;
  };
  const t = Date.now();
  const pages = get("data.json?t="+t);
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split("/").filter(Boolean)[0];
  const raw = (m && repo)
    ? get(`https://raw.githubusercontent.com/${m[1]}/${repo}/snapshot/data.json?t=${t}`)
    : Promise.resolve(null);
  const got = (await Promise.all([pages, raw])).filter(Boolean);
  if(!got.length) return SNAPSHOT_DATA;
  return got.reduce((a,b)=>((b.epoch||0) > (a.epoch||0) ? b : a));
}

// The payload is fetched every poll but the code drawing it is baked into
// index.html, so a browser holding a stale page renders fresh numbers with old
// markup - a new column simply never appears and the page still looks live.
// The build stamp travels with the data; when it moves past the page's own,
// reload once through a URL the CDN has not cached.
function checkBuild(d){
  if(!IS_SNAPSHOT || !d || !d.build || d.build === PAGE_BUILD) return false;
  let tried = null;
  try{ tried = sessionStorage.getItem("gxBuild"); }catch(e){}
  // Only ever one reload per build: if the fresh HTML still disagrees - a
  // deploy mid-flight, or a proxy that ignores the query - stop rather than
  // spin. The stale page keeps working, just without the newest markup.
  if(tried === d.build) return false;
  try{ sessionStorage.setItem("gxBuild", d.build); }catch(e){}
  location.replace(location.pathname + "?b=" + encodeURIComponent(d.build));
  return true;
}

function gxRepaint(){ load(); }
async function load(){
  try{
    const gs=document.getElementById("gxsize"); if(gs) gs.innerHTML=gxToggleHtml();
    const d = await fetchData();
    if(checkBuild(d)) return;
    secs=d.seconds_to_refresh;
    dataEpoch=d.epoch||null;
    document.getElementById("mkt").textContent=d.market;
    const st=document.getElementById("status");
    st.className="status"+(d.market==="OPEN"?"":d.market.startsWith("WEEKEND")?" weekend":" closed");
    document.getElementById("upd").textContent=d.generated||"—";
    document.getElementById("cdlab").textContent=IS_SNAPSHOT?"data age":"next refresh";
    document.getElementById("panels").innerHTML=(d.symbols||[]).map(panel).join("");
    // change flash
    (d.symbols||[]).forEach(s=>{
      if(!s.ok)return;
      for(const key of ["near","full"]){
        const r=(s.regimes||{})[key]; if(!r) continue;
        const gk=`${s.symbol}-${key}-gex`;
        if(last[gk]!==undefined&&last[gk]!==r.net_gex_str){
          const el=document.querySelector(`[data-k="${gk}"]`); if(el)el.classList.add("flash");
        }
        last[gk]=r.net_gex_str;
      }
    });
    const pineEl=document.getElementById("pinebar");
    if(d.pine){
      // The overlay anchors on the 16:59 close while the panels below anchor
      // on Yahoo's daily bar, so the two disagree on purpose. Say which is in
      // use, and call out any product that had to fall back.
      const srcs=(d.symbols||[]).map(x=>(x.margin||{}).pine_src).filter(Boolean);
      const stale=(d.symbols||[]).filter(x=>(x.margin||{}).pine_src==="daily bar")
                                 .map(x=>x.future);
      const note = srcs.length
        ? (stale.length
            ? `<span class="pnote warn">${stale.join("/")} on daily bar, no intraday</span>`
            : `<span class="pnote">16:59 close</span>`)
        : "";
      pineEl.innerHTML=`<span class="k">TradingView liquidation bands</span>`
        +`<code class="pine" id="pinestr" title="click to select" `
        +`onclick="getSelection().selectAllChildren(this)">${d.pine}</code>`
        +note
        +`<button id="pinecopy">Copy</button>`;
      const btn=document.getElementById("pinecopy");
      btn.onclick=async()=>{
        const txt=document.getElementById("pinestr").textContent;
        try{ await navigator.clipboard.writeText(txt); }
        catch(e){ getSelection().selectAllChildren(document.getElementById("pinestr")); }
        btn.textContent="Copied"; setTimeout(()=>btn.textContent="Copy",1200);
      };
    } else { pineEl.innerHTML=""; }
    document.getElementById("foot").innerHTML=
      `Data ~15&nbsp;min delayed · open interest is T-1 · index close proxies the futures close.`
      +(IS_SNAPSHOT
        ? ` Page re-checks for a new snapshot every ${Math.round(POLL_MS/1000)}s.`
        : ` Server recomputes every ${Math.round(REFRESH_SECONDS/60)}&nbsp;min.`)
      +` Margin numbers come from your config.ini and need manual upkeep.`
      // Every regime sign on this page rests on this one assumption, and
      // inverting it inverts all of them - measured 2026-09-28, all four
      // symbols flip. It cannot be resolved on a free feed: only the LAST
      // trade per contract is classifiable (47% nearer ask, 38% nearer bid,
      // 11% mid on QQQ), volume is not open interest CHANGE, and the
      // open/close data that would settle it is a paid Cboe product. Saying
      // so is the honest fix; pretending otherwise is not.
      +(d.vol&&d.vol["30D"]
        ? ` <span class="vix">VIX9D ${d.vol["9D"]} \u00b7 VIX ${d.vol["30D"]}`
          +` \u00b7 VIX3M ${d.vol["3M"]} &mdash; `
          +`${d.vol.inverted?"<b>inverted</b>, the regime where vanna leads"
                            :"contango, so vanna flows stay quiet"}.</span>`
        : "")
      +` <span class="assume">Dealers are assumed long every call and short`
      +` every put. Inverting that assumption inverts every regime sign here;`
      +` it is a convention, not a measurement.</span>`;
  }catch(e){ document.getElementById("mkt").textContent="server unreachable"; }
}
function tick(){
  const cd=document.getElementById("cd");
  if(IS_SNAPSHOT){
    // Count up from the recompute behind this snapshot, so a stalled publisher
    // shows as growing age instead of hiding behind a fake countdown.
    if(dataEpoch) cd.textContent=fmtCd(Math.max(0,Math.floor(Date.now()/1000-dataEpoch)));
    return;
  }
  secs=Math.max(0,secs-1); cd.textContent=fmtCd(secs);
  if(secs<=0){ secs=REFRESH_SECONDS; } }
document.getElementById("refresh").addEventListener("click",async()=>{
  if(IS_SNAPSHOT){ await load(); return; }
  await fetch("/refresh",{method:"POST"}); setTimeout(load,600); });
load(); setInterval(load,IS_SNAPSHOT?POLL_MS:30000); setInterval(tick,1000);
</script>
</body></html>
